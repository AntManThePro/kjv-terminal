<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>KJV Reader</title>
  <meta name="theme-color" content="#0a0a0f" />
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/reader.css?v=8" />
  <link rel="stylesheet" href="css/notes.css?v=8" />
</head>
<body>
  <header class="top">
    <div class="brand"><b>KJV</b><span>Public domain · no account · no ads</span></div>
    <div class="jump">
      <button type="button" id="toOT"><small>Old Testament</small>Genesis</button>
      <button type="button" id="toNT" class="here"><small>New Testament · you are here</small>Matthew</button>
    </div>
    <button class="where" id="where" type="button">Matthew · chapter 1<small>Tap to pick a chapter</small></button>
  </header>
  <div class="nav">
    <button class="btn" id="prev" type="button">← Previous</button>
    <button class="btn" id="next" type="button">Next →</button>
    <button class="btn wide" id="books" type="button">Choose a book</button>
    <button class="btn listen" id="listen" type="button">Read aloud</button>
    <button class="btn more" id="more" type="button">More</button>
  </div>
  <main class="reader" id="reader"></main>
  <div class="hint" id="hint">Tap a verse, then Write a note.</div>
  <form class="look" id="form">
    <input id="q" autocomplete="off" autocapitalize="off" placeholder="Matthew 1" />
    <button class="btn" type="submit">Go</button>
  </form>
  <div class="sheet-bg" id="overlay"><div class="sheet" id="sheet"></div></div>
  <script src="js/seed.js?v=8"></script>
  <script src="js/reader.js?v=8"></script>
</body>
</html>
